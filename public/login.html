<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN</title> 
    <style>
/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

html, body {
  height: 100%;
}

/* ===== PAGE BACKGROUND ===== */
body {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
}

/* ===== LOGO ===== */
.logo {
  margin: 0 0 10px;
  font-size: 28px;
  font-weight: bold;
  text-align: center;
}

.logo span {
  color: #ffd369;
}

/* ===== CENTER WRAP ===== */
.wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}

/* ===== LOGIN CARD ===== */
.card {
  width: 100%;
  max-width: 460px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 2.2rem;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
}

/* ===== HEADING ===== */
h2 {
  font-size: 26px;
  margin-bottom: 1.4rem;
  font-weight: 700;
  text-align: center;
}

/* ===== FORM ===== */
form.add {
  display: grid;
  gap: 1rem;
}

/* ===== FIELD ===== */
.field {
  position: relative;
}

/* ===== LABEL ===== */
label.small {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  opacity: 0.9;
}

/* ===== INPUT ===== */
.input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  outline: none;
  background: rgba(255, 255, 255, 0.92);
  color: #333;
  transition: 0.3s;
}

.input::placeholder {
  color: #777;
}

.input:focus {
  box-shadow: 0 0 0 3px rgba(255, 211, 105, 0.45);
}

/* ===== PASSWORD TOGGLE ===== */
.toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: #555;
}

/* ===== LINKS ROW ===== */
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.register,
.forget {
  font-size: 14px;
  font-weight: 600;
  color: #ffd369;
  text-decoration: none;
}

.register:hover,
.forget:hover {
  text-decoration: underline;
}

/* ===== LOGIN BUTTON ===== */
#login {
  margin-top: 10px;
  background: #ffd369;
  color: #333;
  border: none;
  padding: 14px;
  border-radius: 25px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s ease;
}

#login:hover {
  background: #ffcb4c;
  transform: translateY(-2px);
}

/* ===== ERROR MESSAGE ===== */
.err {
  background: rgba(255, 0, 0, 0.12);
  border-left: 4px solid #ffd369;
  padding: 10px;
  border-radius: 10px;
  font-size: 14px;
}

.err ul {
  margin-left: 18px;
}

/* ===== HELPER TEXT ===== */
.helper {
  font-size: 13px;
  opacity: 0.85;
  margin-top: 4px;
  text-align: center;
}

.helper a {
  color: #ffd369;
  font-weight: 600;
  text-decoration: underline;
}

/* ===== TABLETS ===== */
@media (max-width: 768px) {
  .card {
    max-width: 420px;
    padding: 2rem;
  }
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
  .wrap {
    padding: 1rem;
  }

  .card {
    padding: 1.6rem;
    border-radius: 14px;
  }

  h2 {
    font-size: 22px;
  }

  .input {
    font-size: 14px;
    padding: 12px;
  }

  #login {
    font-size: 14px;
    padding: 13px;
  }

  .row {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }

  .toggle {
    font-size: 12px;
    right: 10px;
  }
}

/* ===== VERY SMALL PHONES ===== */
@media (max-width: 360px) {
  h2 {
    font-size: 20px;
  }

  .helper {
    font-size: 12px;
  }
}
    </style>
  </head>
  <body>
    <div class="wrap">
      <main class="card" role="main" aria-labelledby="signin-title">
        <h1 class="logo">Todo<span>Pro</span></h1>
        <h2 id="signin-title">Welcome back</h2>

        <form action="/login" method="POST" class="add" novalidate>

          <div class="field">
            <label class="small" for="email">Email</label>
            <input class="input" id="email" type="email" name="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label class="small" for="password">Password</label>
            <input class="input" id="password" type="password" name="password" placeholder="Enter your password" required />
            <button type="button" class="toggle" id="togglePwd" aria-label="Show password">Show</button>
          </div>

          <div class="row">
            <a href="/forget" class="forget">Forget Password?</a>
            <a href="/signup" class="register">Need an account?</a>
          </div>

          <input class="input" id="login" type="submit" value="Sign In" />

          <p class="helper">By signing in you agree to our <a href="#" style="color:var(--taupe);text-decoration:underline;">Terms</a> and <a href="#" style="color:var(--taupe);text-decoration:underline;">Privacy</a>.</p>

        </form>
      </main>
    </div>

    <script>
      // Show / hide password (accessible)
      (function(){
        const pwd = document.getElementById('password');
        const btn = document.getElementById('togglePwd');
        if(!pwd || !btn) return;
        btn.addEventListener('click', ()=>{
          if(pwd.type === 'password'){
            pwd.type = 'text';
            btn.textContent = 'Hide';
            btn.setAttribute('aria-pressed','true');
          } else {
            pwd.type = 'password';
            btn.textContent = 'Show';
            btn.setAttribute('aria-pressed','false');
          }
        });
      })();
    </script>
  </body>
</html>
